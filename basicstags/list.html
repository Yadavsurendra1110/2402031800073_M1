<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1> Ordered List </h1>
    <ol>
        <li> Item 1 </li>
        <li> Item 2</li>

        <ol type="A">
            <li> Sublist items one </li>
            <li> Submit items two</li>
            <ol type="I">
                <li> Sub-sub list items one </li>
                <li> Sub - sub list item two</li>


            </ol>
        </ol>
    </ol>

    <h1> Unorder list </h1>
    <ul type="disc">
        <li> tree palm</li>
        <li> palm is sick</li>
        <li> sick is ill</li>
        <ul type="square">

            <li> tree</li>
            <li> palm</li>
            <li> sick </li>
        </ul>
    </ul>


</body>

</html>
