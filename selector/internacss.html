<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         
        p,h1 {
            color : maroon;
            text-align : center ;
            font-size: 200%;
        }
        div h1 {
            color:blueviolet;
            font-size: 300%; 
        }
    </style>
</head>
<body>
    <!-- this is an multiple tags in single initialization -->

    <h1> line </h1>
    <p> second line </p>
    <!-- div h1 means the properties are only aplicable for the h1 when it is inside the div-->
    <!-- div and H1 initialization in single intitialization-->
     <div> 
        <h1> h1 inside div </h1>
     </div>
</body>
</html>
