<body>

    <h1> Loops using JS</h1>
    <h3> Practical-1</h3>

    <script>
        for(var i=1;i<=10;i++)
    {
        document.write("<br>"+i);
    }

    </script>
<h3> Practical-2 </h3>
    <script>

        var a=10;
        while(a>=1)
    {
        document.write("<br>" +a);
        a--;
    }
    </script>

    <h4>Practical-3</h4>

    <script> 
    
    
    for(var b=1;b<=20;b++)
    {
        if(b%2==0)
    {
        document.write("<br>" +b);

    }
    }
    </script>
    
    <h3> Practical-4</h3>

    <script>
        var c=0;
        do{
            document.write("<br>" +c);
            c+=2;
        }
        while(c<=15);
        
    </script>
    
    <h3 class="demo"> User Login attempts</h3>
   <h2>Login Page</h2>
<div>
Username:
<input type="text" id="username">

<br><br>

Password:
<input type="password" id="password">

<br><br>

<button onclick="login()">Login</button>

<p id="msg"></p>

<script>

let attempts = 3;

function login()
{
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(attempts > 0)
    {
        if(user == "admin" && pass == "1234")
        {
            document.getElementById("msg").innerHTML = "Login Successful";
            attempts = 3; // reset if needed
        }
        else
        {
            attempts--;
            document.getElementById("msg").innerHTML =
            "Wrong credentials. Attempts left: " + attempts;

            if(attempts == 0)
            {
                document.getElementById("password").disabled = true;
                document.getElementById("username").disabled = true;
                document.getElementById("msg").innerHTML =
                "Account Locked! No attempts left.";
            }
        }
    }
}

</script>


</div>
