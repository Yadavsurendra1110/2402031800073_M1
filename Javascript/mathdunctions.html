<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Functions </title>
    <style>
        header {
            text-align: center;
            color: black;
            font-style: italic;
            font-size: 80px;
            background-color: aquamarine;
        }

        .demo1 {
            background-color: palevioletred;
            height: 200px;

        }

        .demo2 {
            background-color: rgb(35, 185, 204);
            height: 200px;

            top: 120px;
            left: 400px;

            font-size: 25px;
            float: left;

        }

        .demo3 {
            background-color: rgb(35, 204, 63);
            height: 200px;

            top: 120px;
            left: 800px;
            position: absolute;
            font-size: 25px;

        }

        .demo4 {
            background-color: rgb(204, 35, 139);
            height: 200px;
            width: 350px;
            top: 120px;
            left: 1200px;
            position: absolute;
            font-size: 25px;
            float: left;

        }

        .demo5 {
            background-color: rgb(86, 160, 139);
            height: 200px;
            width: 350px;
            top: 350px;
            left: 10px;
            position: absolute;
            font-size: 25px;
            float: left;

        }

        .demo6 {
            background-color: rgb(3, 255, 196);
            height: 200px;
            width: 350px;
            top: 350px;
            left: 400px;
            position: absolute;
            font-size: 25px;
            float: left;

        }

        .demo7 {
            background-color: rgb(134, 35, 204);
            height: 200px;
            width: 350px;
            top: 350px;
            left: 800px;
            position: absolute;
            font-size: 25px;
            float: left;
        }

        .demo8 {
            background-color: rgb(109, 12, 72);
            height: 200px;

            font-size: 25px;

        }
    </style>
</head>

<body>
    <header>
        Math Functions </header>
    <div class="demo1">
        <h3> Math.round() </h3>

        <script>
            var num = 5.555;
            document.write("The number entered is : " + num);
            document.write("<br> ");
            document.write("Using round method" + Math.round(num));
        </script>
    </div>


    <div class="demo2">
        <h3> Math.floor() </h3>
        <script>
            var num1 = 4.956;
            document.write("The number entered is : " + num1);
            document.write("<br>");
            document.write("After functions : " + Math.floor(num1));
        </script>
    </div>

    <div class="demo3">
        <h3> Math.ceil </h3>
        <script>
            var num2 = 4.956;
            document.write("The number entered is : " + num2);
            document.write("<br>");
            document.write("After functions : " + Math.ceil(num2));
        </script>

    </div>

    <div class="demo4">
        <h3> Math.pow </h3>
        <script>
            var x = 4;
            var y = 5;
            document.write("The number entered (x,y) : " + x + y);
            document.write("<br>");
            document.write("After functions : " + Math.pow(x, y));
        </script>
    </div>

    <div class="demo5">
        <h3> Math.pi </h3>
        <script>
            document.write(Math.PI);
        </script>
    </div>

    <div class="demo6">
        <h3> Math.random </h3>
        <script>
            document.write(Math.random());
        </script>
    </div>

    <div class="demo7">
        <h3> Math.abs </h3>
        <script>
            document.write(Math.abs(-5));
        </script>
    </div>

    <div class="demo8">
        <h3> Math.max </h3>
        <script>
            document.write(Math.max(10, 50, 60));
        </script>
    </div>



    <h3> Math.min </h3>
    <script>
        document.write(Math.min(10, 60, 86413, 5));
    </script>


    <h3> Math.sqrt </h3>
    <script>
        document.write(Math.sqrt(81));
    </script>

</body>
