<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> JavaScript Variables</h1>
    <h2 id="demo1"></h2>
     <h3>Declaration with "var" Variable </h3>
    <p id="demo"> </p>
    <h3> Declaration with "let" variable</h3>
    <p id="demo3"></p>
    <h3> Declaration with "const" variable </h3>
    <p id="demo4"></p>
    <script > 
    var x= 5;y=4;
    var z=x+y;

    let a=5;b=5;
    let c=a*b;

    const A=3;B=6;
    const C=A/B;

    document.getElementById("demo1").innerHTML=" Variable"
    document.getElementById("demo").innerHTML="The Addition is = "+z;
    document.getElementById("demo3").innerHTML="Multiplication is = " +c;
    document.getElementById("demo4").innerHTML="Division is = " +C;

    </script>


</body>
</html>
