<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div> 
    <h1> Operators </h1>
    <h2>Increament operators</h2>
    <h3> post increment :- </h3>
    
    <script>
        
        var a=5;
        document.write("The value of variable before increament is = " +a);
        document.write("<br>");
        a++;
        document.write("The value of variable after post-increament is = "+a); 
    </script>

    <h3> pre increament :- </h3>
    <script> 
        var b=7;
        document.write("The value of variable before increament is = " +b);
        document.write("<br>");
        ++b;
        document.write("The value of variable after pre-increament is = "+b); 
    </script>

    <h2>Conparision operators</h2>
    <script>
        var a=7;
        var b=6;
        document.write(a>b);
        document.write("<br>");
         let d=7;
         let c=6;
        document.write(d<c);

        
     </script>


    </div>
</body>
</html>
