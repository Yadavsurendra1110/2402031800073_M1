<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1> Variables Types</h1>
    <h2> Primitive Datatypes</h2>


    <script>
        var a = 1;
        document.write("Value assgned of a is : " + a);
        document.write("<br>")
        document.write(typeof a);

        var b = true;
        document.write("<br> <br> Value of assgned variable b is = " + b);
        document.write("<br>")
        document.write(typeof b);

    </script>

    <h2> Composite Data Types </h2>

    <script>

        const student_details = {
            Name: "Surendra Pratap Yadav",
            Enrol_no: 2402031800073,
            course: "OJT"
        };
        document.write(student_details.Name);
        document.write("<br>");
        document.write(student_details.Enrol_no);
        document.write("<br>");
        document.write(student_details.course);
        document.write("<br>");
        document.write(typeof student_details);
        document.write("<br>");
        document.write("<br>");

        var cars = ["BMW ,  VOLVO ,  Mercedes"];
        document.write(cars);
        document.write("<br>");
        document.write(typeof cars);

    </script>


</body>

</html>
