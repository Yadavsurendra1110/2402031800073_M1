<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a="Surendra";
        var b="Yadav";
        var str="HIRAL";
        var c=100;
        document.write(a.charAt(0));
        document.write("<br>");
        document.write(a.concat(" ",b));
        document.write("<br>");
        document.write(a.indexOf("a"));
        document.write("<br>");
        document.write(a.lastIndexOf("S"));
        document.write("<br>");
        document.write(a.search("ndra"));
        document.write("<br>");
        document.write(b.match("Yad"));
        document.write("<br>");
        document.write(a.replace("Surendra" ,  "Hiral"));
        document.write("<br>");
        document.write(a.substr(2,4));
        document.write("<br>");
        document.write(a.slice(2,8));
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(a.toUpperCase())
        document.write("<br>");
        document.write(a.toLocaleUpperCase());
        document.write("<br>");
        document.write(c.toString());
        
    </script>
</body>
</html>
