<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Accordion (jQuery)</title>
     <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    
    <style>
        .faq-container {
            max-width: 600px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        .faq-item {
            border-bottom: 1px solid #ddd;
            padding: 5px 0;
        }
        .faq-question {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .faq-icon {
            font-size: 22px;
            font-weight: bold;
            color: #007BFF;
        }
        .faq-answer {
            display: none; /* Hidden by default */
            padding: 0 10px 15px 10px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="faq-container">
    <!-- Item 1 -->
    <div class="faq-item">
        <button class="faq-question">
            What is jQuery?
            <span class="faq-icon">+</span>
        </button>
        <div class="faq-answer">
            jQuery is a fast, small, and feature-rich JavaScript library that makes HTML document traversal and manipulation much simpler.
        </div>
    </div>

    <div class="faq-item">
        <button class="faq-question">
            How does slideToggle work?
            <span class="faq-icon">+</span>
        </button>
        <div class="faq-answer">
            The slideToggle() method animates the height of the selected elements. If the element is hidden, it slides down; if visible, it slides up.
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $(".faq-question").click(function() {
        $(this).next(".faq-answer").slideToggle(200);

        let icon = $(this).find(".faq-icon");

        if (icon.text() === "+") {
            icon.text("-");
        } else {
            icon.text("+");
        }
    });
});
</script>

</body>
</html>
